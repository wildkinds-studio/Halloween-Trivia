<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Cinzel+Decorative:wght@700&amp;family=Monoton&amp;family=Righteous&amp;family=Racing+Sans+One&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,600..800;1,6..96,600..800&amp;family=Jost:wght@500..700&amp;family=Fredoka:wght@500..700&amp;display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}
/* Layout: a dark TV-studio stage. Setup screens are the wings; each round re-lights the stage in its guest's theme. */
:root {
  --stage: #13111d;
  --panel: #1c1a2a;
  --raised: #282439;
  --line: #3c3756;
  --text: #f7f2e8;
  --muted: #aaa3c4;
  --gold: #ffcb47;
  --gold-ink: #2a1d00;
  --pink: #ff5d7d;
  --mint: #45e0a5;
  --sky: #6cc4ff;
  --easy: #45e0a5;
  --medium: #ffcb47;
  --hard: #ff5d7d;
  --danger: #ff5d5d;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--stage);
  background-image: radial-gradient(120% 70% at 50% -10%, #2a2346 0%, rgba(19,17,29,0) 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--stage);
}
#app { min-height: 100%; display: flex; flex-direction: column; }
body.is-play { overflow: hidden; }
body.is-play #app { height: 100%; min-height: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nums { font-variant-numeric: tabular-nums; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 22px; border-radius: 999px; border: 2px solid transparent;
  background: var(--raised); color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: .01em;
  transition: transform .12s ease, background-color .15s ease, border-color .15s ease, opacity .15s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--gold); color: var(--gold-ink); }
.btn-primary:hover { background: #ffd66e; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-danger { background: transparent; border-color: rgba(255,93,93,.55); color: #ff8f8f; }
.btn-danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn-xl { min-height: 68px; padding: 0 34px; font-size: 21px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel);
  display: inline-grid; place-items: center; flex: none; transition: transform .12s ease, border-color .15s;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.sm { width: 44px; height: 44px; font-size: 22px; font-weight: 700; }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }

.icon-btn.sm svg { width: 18px; height: 18px; }
.link-btn { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Page shell (setup screens) ---------- */
.page {
  width: 100%; max-width: 1100px; margin: 0 auto; flex: 1;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 24px;
}
.page-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(28px, 4.2vw, 40px); flex: 1; min-width: 0; }
.page-head .sub { color: var(--muted); font-size: 15px; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 22px; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
.footer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: linear-gradient(180deg, rgba(19,17,29,0), rgba(19,17,29,.94) 30%);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-top: 26px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.footer-bar .inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.footer-bar .grow { flex: 1; min-width: 0; color: var(--muted); font-weight: 600; }

/* ---------- Home ---------- */
.home-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 12px; }
.home-hero h1 {
  font-size: clamp(54px, 10vw, 112px); font-weight: 800; letter-spacing: -0.035em; line-height: .9;
  font-variation-settings: "opsz" 96;
}
.home-hero h1 .dot { color: var(--gold); }
.home-hero .date { color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.marquee { display: flex; gap: 10px; margin-top: 14px; }
.marquee i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); opacity: .9; animation: bulb 1.6s ease-in-out infinite; }
.marquee i:nth-child(2n) { animation-delay: .8s; background: var(--pink); box-shadow: 0 0 12px var(--pink); }
@keyframes bulb { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

.continue-card {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px;
  background: linear-gradient(120deg, #3a2c12, #2b2140 70%); border: 2px solid rgba(255,203,71,.5);
  border-radius: var(--r-lg); padding: 18px 20px;
}
.continue-card h3 { font-size: 24px; }
.continue-card .status { color: #f3dca4; font-weight: 600; }
.continue-card .avatars { display: flex; }
.continue-card .avatars .av { margin-left: -12px; border: 3px solid #2f2440; }
.continue-card .avatars .av:first-child { margin-left: 0; }
.continue-card .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.tiles { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; }
.tile {
  position: relative; text-align: left; border: 0; border-radius: var(--r-lg); padding: 22px;
  min-height: 200px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
  background: var(--panel); outline: 1px solid var(--line); outline-offset: -1px; overflow: hidden;
  transition: transform .15s ease;
}
.tile:active { transform: scale(.985); }
.tile h2 { font-size: 30px; }
.tile p { color: var(--muted); font-weight: 500; max-width: 30ch; }
.tile .tile-icon { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--raised); }
.tile .tile-icon svg { width: 28px; height: 28px; }
.tile-new { background: var(--gold); color: var(--gold-ink); outline: 0; }
.tile-new p { color: rgba(42,29,0,.75); }
.tile-new .tile-icon { background: rgba(42,29,0,.12); }
.tile .strip { display: flex; flex-wrap: wrap; gap: 6px; }
.tile .strip .av { --av: 38px; }

.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.how .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.how .step b { font-family: var(--f-display); font-size: 18px; }
.how .step .n { font-family: var(--f-display); font-weight: 800; color: var(--gold); font-size: 14px; letter-spacing: .1em; }
.how .step p { color: var(--muted); font-size: 15px; }
.demo-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.sync-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
.sync-note .led { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync-note.ok .led { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.sync-note.warn .led { background: var(--gold); }
.sync-note.bad .led { background: var(--danger); }
.sync-note.bad { color: #ffb0b0; }

/* ---------- Avatars ---------- */
.av {
  --av: 44px; width: var(--av); height: var(--av); font-size: var(--av); border-radius: 50%; overflow: hidden; flex: none; position: relative;
  background: var(--raised); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800;
}
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
.av .ini { font-size: .4em; line-height: 1; color: #fff; }
.av.av-lg { --av: 120px; }
.av.av-56 { --av: 56px; }

.portrait {
  position: relative; aspect-ratio: 3 / 4; border-radius: var(--r-md); overflow: hidden; background: var(--raised);
  display: grid; place-items: center; width: 100%; max-width: 100%;
}
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.portrait .ini { font-family: var(--f-display); font-weight: 800; font-size: clamp(36px, 6vw, 64px); color: rgba(255,255,255,.92); }

/* ---------- Players ---------- */
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.player-card {
  border: 0; background: var(--panel); border-radius: var(--r-lg); padding: 10px 10px 14px; text-align: left;
  display: flex; flex-direction: column; gap: 10px; outline: 1px solid var(--line); outline-offset: -1px;
  transition: transform .12s ease; position: relative; min-width: 0;
}
.player-card:active { transform: scale(.98); }
.player-card .name { font-family: var(--f-display); font-weight: 700; font-size: 19px; padding: 0 4px; overflow-wrap: anywhere; line-height: 1.15; }
.player-card .tag { position: absolute; top: 18px; left: 18px; background: rgba(19,17,29,.78); color: #ffe39b; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.player-card.add { outline: 2px dashed var(--line); background: transparent; align-items: stretch; }
.player-card.add .portrait { background: transparent; border: 0; }
.player-card.add .plus { display: grid; place-items: center; gap: 8px; color: var(--muted); font-weight: 700; text-align: center; }
.player-card.add .plus svg { width: 44px; height: 44px; color: var(--gold); }
.player-card.selectable[aria-pressed="true"] { outline: 3px solid var(--gold); background: #2e2717; }
.player-card .check {
  position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(19,17,29,.7); border: 2px solid rgba(255,255,255,.6); display: grid; place-items: center;
}
.player-card .check svg { width: 18px; height: 18px; opacity: 0; }
.player-card[aria-pressed="true"] .check { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.player-card[aria-pressed="true"] .check svg { opacity: 1; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field label, .field .label { font-weight: 700; font-size: 14px; color: var(--muted); letter-spacing: .02em; }
.input, .textarea {
  width: 100%; min-height: 52px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--stage);
  padding: 12px 14px; font-size: 18px; color: var(--text); transition: border-color .15s;
}
.textarea { min-height: 84px; resize: vertical; line-height: 1.35; }
.q-card .textarea { min-height: 52px; resize: none; overflow: hidden; }
.input:focus, .textarea:focus { border-color: var(--gold); outline: none; }
.input.big { font-size: 26px; font-family: var(--f-display); font-weight: 700; min-height: 64px; }
.input::placeholder, .textarea::placeholder { color: #6f6990; }
.input.invalid { border-color: var(--danger); }
.hint { font-size: 14px; color: var(--muted); }
.hint.warn { color: #ffd27a; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.seg { display: inline-flex; background: var(--stage); border: 2px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; flex-wrap: nowrap; }
.seg button {
  border: 0; background: transparent; border-radius: 999px; min-height: 44px; padding: 0 14px; font-weight: 700; font-size: 15px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button .p { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"][data-diff="1"] { background: var(--easy); color: #062a1c; }
.seg button[aria-pressed="true"][data-diff="2"] { background: var(--medium); color: #2a1d00; }
.seg button[aria-pressed="true"][data-diff="3"] { background: var(--hard); color: #2b0610; }
.seg button[aria-pressed="true"]:not([data-diff]) { background: var(--raised); color: var(--text); }

.switch { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; background: none; border: 0; padding: 4px 0; min-height: 44px; text-align: left; }
.switch .track { width: 54px; height: 32px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .18s ease; }
.switch[aria-checked="true"] .track { background: var(--mint); }
.switch[aria-checked="true"] .track::after { transform: translateX(22px); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-weight: 800; font-size: 13px; letter-spacing: .03em; white-space: nowrap; }
.chip.d1 { background: rgba(69,224,165,.16); color: var(--easy); }
.chip.d2 { background: rgba(255,203,71,.16); color: var(--medium); }
.chip.d3 { background: rgba(255,93,125,.16); color: var(--hard); }
.chip.ok { background: rgba(69,224,165,.16); color: var(--mint); }
.chip.warn { background: rgba(255,203,71,.16); color: var(--gold); }
.chip.off { background: var(--raised); color: var(--muted); }

/* ---------- Stepper ---------- */
.stepper { display: flex; gap: 8px; flex-wrap: wrap; }
.stepper button {
  border: 0; background: var(--panel); border-radius: 999px; padding: 8px 16px 8px 8px; display: inline-flex; align-items: center; gap: 10px;
  color: var(--muted); font-weight: 700; outline: 1px solid var(--line); outline-offset: -1px;
}
.stepper button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); font-size: 14px; }
.stepper button[aria-current="step"] { color: var(--text); outline-color: var(--gold); }
.stepper button[aria-current="step"] .n { background: var(--gold); color: var(--gold-ink); }

/* ---------- Rounds list ---------- */
.round-list { display: flex; flex-direction: column; gap: 12px; }
.round-row {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
  background: var(--panel); border-radius: var(--r-md); padding: 12px 14px; outline: 1px solid var(--line); outline-offset: -1px;
}
.round-row .order { display: flex; flex-direction: column; gap: 4px; }
.round-row .num { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--muted); width: 30px; text-align: center; }
.round-row .who { min-width: 0; }
.round-row .who { display: flex; flex-direction: column; gap: 2px; }
.round-row .who .cat { font-family: var(--f-display); font-weight: 700; font-size: 21px; overflow-wrap: anywhere; line-height: 1.15; }
.round-row .who .cat.empty { color: var(--muted); font-style: italic; font-weight: 600; }
.round-row .who .by { color: var(--muted); font-size: 15px; font-weight: 600; }
.round-row .counts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.round-row .swatch { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; }
.round-row.skip { opacity: .6; }

/* ---------- Round editor ---------- */
.editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 20px; align-items: start; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.theme-tile {
  position: relative; border: 0; border-radius: 14px; aspect-ratio: 4 / 3; overflow: hidden; padding: 0; isolation: isolate;
  outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s, transform .12s; max-width: 100%;
}
.theme-tile:active { transform: scale(.97); }
.theme-tile[aria-pressed="true"] { outline-color: var(--gold); }
.theme-tile .tt-inner { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 10px; text-align: left; }
.theme-tile .tt-aa { font-family: var(--t-title); font-size: 26px; line-height: 1; color: var(--t-accent); }
.theme-tile .tt-name { font-weight: 800; font-size: 13px; color: var(--t-ink); background: var(--t-card); color: var(--t-card-ink); align-self: flex-start; padding: 2px 8px; border-radius: 999px; }
.theme-tile .tt-emoji { position: absolute; right: 8px; top: 6px; font-size: 22px; }
.preview-card { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 4 / 3; position: relative; max-width: 100%; }
.preview-card .stage { position: absolute; inset: 0; height: auto; }
.preview-card .pv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center; }
.preview-card .pv .pv-emoji { font-size: 40px; }
.preview-card .pv .pv-title { font-family: var(--t-title); color: var(--t-accent); font-size: calc(36px * var(--t-titlescale)); line-height: 1.05; overflow-wrap: anywhere; text-wrap: balance; }
.preview-card .pv .pv-by { color: var(--t-ink); font-weight: 700; font-size: 14px; }
.th-boxed .preview-card .pv .pv-title, .preview-card .stage.th-boxed .pv-title { background: var(--t-card); padding: 6px 14px; border-radius: 12px; border: 3px solid var(--t-line); }

.q-list { display: flex; flex-direction: column; gap: 14px; }
.q-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.q-card .q-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-card .q-n { font-family: var(--f-display); font-weight: 800; font-size: 20px; width: 34px; }
.q-card .q-tools { margin-left: auto; display: flex; gap: 4px; }
.q-card .answer-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.q-card .answer-row .tag { font-weight: 800; color: var(--mint); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
/* Multiple-choice editor */
.mc-edit { display: flex; flex-direction: column; gap: 8px; }
.mc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.mc-row.right { grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.mc-row.right .textarea { border-color: rgba(69,224,165,.55); }
.mc-row .input { min-height: 46px; font-size: 17px; padding: 8px 12px; }
.mc-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.mc-tag svg { width: 16px; height: 16px; }
.mc-tag.ok { color: var(--mint); }
.mc-tag.no { color: #ff9aae; margin-top: 4px; }
.mc-row.wrong .icon-btn.sm[data-act="q-make-right"] { color: var(--mint); }
.mc-add { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; }
.mc-add svg { width: 16px; height: 16px; }
.mc-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }
.mc-preview .link-btn { display: inline-flex; align-items: center; gap: 6px; }
.mc-preview .link-btn svg { width: 16px; height: 16px; }
.mc-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border-radius: 999px; padding: 4px 11px; font-size: 14px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; }
.mc-chip b { color: var(--muted); }
.mc-chip.ok { background: rgba(69,224,165,.16); color: var(--mint); }
.mc-chip.ok b { color: var(--mint); }
.mc-chip svg { width: 14px; height: 14px; flex: none; }
.pv-choices { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 28px; }

.q-empty { border: 2px dashed var(--line); border-radius: var(--r-md); padding: 26px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.emoji-input { width: 84px; text-align: center; font-size: 28px; }
.diff-summary { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Review ---------- */
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.review-card.stage { height: auto; flex: none; }
.review-card { border-radius: var(--r-md); overflow: hidden; position: relative; min-height: 170px; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; gap: 10px; }
.review-card .rc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.review-card .rc-no { font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--t-ink); background: var(--t-card); padding: 3px 10px; border-radius: 999px; }
.review-card .rc-title { font-family: var(--t-title); color: var(--t-accent); font-size: calc(26px * var(--t-titlescale)); line-height: 1.05; overflow-wrap: anywhere; }
.th-boxed .rc-title { background: var(--t-card); padding: 4px 12px; border-radius: 10px; border: 3px solid var(--t-line); align-self: flex-start; }
.review-card .rc-foot { display: flex; align-items: center; gap: 10px; background: var(--t-card); color: var(--t-card-ink); border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: 14px; }
.review-card .rc-foot .av { --av: 34px; }
.warn-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.warn-list li { display: flex; gap: 10px; align-items: flex-start; background: rgba(255,203,71,.08); border: 1px solid rgba(255,203,71,.3); border-radius: 12px; padding: 10px 14px; color: #ffe2a0; font-weight: 600; }
.big-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.big-stats div { display: flex; flex-direction: column; }
.big-stats b { font-family: var(--f-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.big-stats span { color: var(--muted); font-weight: 600; }

/* ---------- Overlay: sheets, dialogs, toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,7,14,.72); display: grid; place-items: center; padding: 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(760px, 100%); max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: 0 30px 80px rgba(0,0,0,.5); display: flex; flex-direction: column;
  animation: rise .22s cubic-bezier(.2,.9,.3,1.2);
}
.sheet.narrow { width: min(520px, 100%); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.sheet-head h2 { flex: 1; font-size: 26px; min-width: 0; }
.sheet-body { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 18px; }
.sheet-foot { padding: 14px 20px 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.sheet-foot .spacer { flex: 1; }
.dialog p { color: var(--muted); font-size: 17px; }

.photo-edit { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 20px; align-items: start; }
.crop-frame { position: relative; aspect-ratio: 3 / 4; border-radius: var(--r-md); overflow: hidden; background: #0b0a12; touch-action: none; cursor: grab; width: 100%; max-width: 100%; }
.crop-frame canvas.src { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.crop-frame .guides { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(90deg, transparent calc(33.33% - 1px), rgba(255,255,255,.28) calc(33.33% - 1px) 33.33%, transparent 33.33% calc(66.66% - 1px), rgba(255,255,255,.28) calc(66.66% - 1px) 66.66%, transparent 66.66%),
  linear-gradient(0deg, transparent calc(33.33% - 1px), rgba(255,255,255,.28) calc(33.33% - 1px) 33.33%, transparent 33.33% calc(66.66% - 1px), rgba(255,255,255,.28) calc(66.66% - 1px) 66.66%, transparent 66.66%);
  box-shadow: inset 0 0 0 2px rgba(255,203,71,.8); border-radius: var(--r-md); }
/* Meeko shows in a circle, so his photos are framed square with the circle marked. */
.crop-frame.square { aspect-ratio: 1 / 1; }
.crop-frame.square .guides { background: radial-gradient(circle closest-side, transparent calc(100% - 3px), rgba(255,203,71,.9) calc(100% - 3px) 100%, rgba(5,4,10,.55) 100%); }
.photo-actions { display: flex; flex-direction: column; gap: 10px; }
.photo-actions .btn { justify-content: flex-start; }
.file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.range { width: 100%; accent-color: var(--gold); height: 32px; }

.toast-wrap { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: #f7f2e8; color: #1b1826; font-weight: 700; padding: 12px 20px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: rise .2s ease; text-align: center; }
.toast.bad { background: #ffd0d0; color: #4a0b0b; }

/* ---------- Themed stage (play screens) ---------- */
.stage {
  position: relative; isolation: isolate; overflow: hidden; height: 100%; min-height: 0; flex: 1;
  color: var(--t-ink); background: #1a1530;
}
.stage::before, .stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.play { height: 100%; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
.play-inner {
  position: relative; height: 100%; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
}
.play-bar { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.play-bar .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.play-bar .crumb { font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--t-ink); opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play-bar .pill { display: inline-flex; align-items: center; gap: 10px; background: var(--t-card); color: var(--t-card-ink); padding: 5px 14px 5px 5px; border-radius: 999px; font-weight: 700; min-width: 0; max-width: 100%; }
.play-bar .pill .av { --av: 36px; }
.play-bar .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .icon-btn { background: var(--t-card); border-color: var(--t-line); color: var(--t-card-ink); }
.play-foot { display: flex; align-items: center; gap: 12px; }
.play-foot .mid { flex: 1; display: flex; justify-content: center; min-width: 0; }
.play-foot .btn { min-width: 0; max-width: 100%; flex-shrink: 1; }
.play-foot .btn > span { min-width: 0; }
.btn-stage { background: var(--t-accent); color: #111; border-color: transparent; }
.stage.th-light .btn-stage { color: #fff; }
.btn-stage-ghost { background: var(--t-card); color: var(--t-card-ink); border-color: var(--t-line); }
.dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
.th-boxed .dots { background: var(--t-card); border: 3px solid var(--t-line); padding: 6px 12px; border-radius: 999px; }
.th-tabloid .intro .emoji, .th-tabloid .inter .emoji { filter: drop-shadow(3px 3px 0 #111); }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: .28; color: var(--t-ink); }
.dots i.d1 { color: var(--easy); } .dots i.d2 { color: var(--medium); } .dots i.d3 { color: var(--hard); }
.dots i.done { opacity: .75; }
.dots i.on { opacity: 1; transform: scale(1.35); box-shadow: 0 0 0 3px var(--t-card); }

/* Round intro */
.intro { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 1.8vh, 26px); overflow: hidden; }
.intro .round-no { font-weight: 800; letter-spacing: .22em; text-transform: uppercase; font-size: clamp(14px, 1.8vw, 20px); background: var(--t-card); color: var(--t-card-ink); padding: 8px 18px; border-radius: 999px; }
.intro .emoji { font-size: clamp(44px, 8vh, 110px); line-height: 1; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
.intro .cat-title {
  font-family: var(--t-title); color: var(--t-accent); font-weight: 400; max-width: 18ch;
  font-size: calc(clamp(40px, min(9vw, 11vh), 120px) * var(--t-titlescale)); line-height: 1; overflow-wrap: anywhere; text-wrap: balance;
  text-shadow: 0 4px 0 rgba(0,0,0,.18);
}
.th-upper .cat-title, .th-upper .pv-title, .th-upper .rc-title { text-transform: uppercase; }
.th-italic .cat-title, .th-italic .pv-title, .th-italic .rc-title { font-style: italic; }
.th-boxed .intro .cat-title { background: var(--t-card); padding: 10px 26px 16px; border-radius: 18px; border: 4px solid var(--t-line); box-shadow: 8px 8px 0 rgba(0,0,0,.85); }
.intro .host { display: flex; align-items: center; gap: 16px; background: var(--t-card); color: var(--t-card-ink); border: 2px solid var(--t-line); padding: 10px 24px 10px 10px; border-radius: 999px; text-align: left; }
.intro .host .av { --av: clamp(64px, 11vh, 110px); border: 3px solid var(--t-accent); }
.intro .host small { display: block; font-weight: 700; opacity: .75; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
.intro .host strong { font-family: var(--t-title); font-size: calc(clamp(24px, 3.4vw, 40px) * var(--t-titlescale)); line-height: 1.1; font-weight: 400; }
.intro .meta { font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.intro .meta .chip { background: var(--t-card); }

/* Question */
.q-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 18px); }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.q-count { font-family: var(--t-title); color: var(--t-accent); font-size: calc(clamp(26px, 4vw, 46px) * var(--t-titlescale)); line-height: 1; }
.q-count small { font-family: var(--f-body); color: var(--t-ink); font-size: 18px; opacity: .75; font-weight: 700; margin-left: 6px; }
.diff-badge { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: clamp(15px, 1.8vw, 20px); letter-spacing: .04em; background: var(--t-card); color: var(--t-card-ink); border: 2px solid; }
.diff-badge.d1 { border-color: var(--easy); } .diff-badge.d2 { border-color: var(--medium); } .diff-badge.d3 { border-color: var(--hard); }
.diff-badge .pts { opacity: .78; font-weight: 700; }
.diff-badge i { width: 12px; height: 12px; border-radius: 50%; }
.diff-badge.d1 i { background: var(--easy); } .diff-badge.d2 i { background: var(--medium); } .diff-badge.d3 i { background: var(--hard); }
.q-card-big {
  flex: 1; min-height: 0; background: var(--t-card); color: var(--t-card-ink); border: 2px solid var(--t-line); border-radius: clamp(18px, 3vw, 32px);
  display: flex; align-items: center; justify-content: center; padding: clamp(18px, 4vw, 56px); text-align: center; position: relative; overflow: hidden;
}
.th-boxed .q-card-big { border-width: 4px; box-shadow: 10px 10px 0 rgba(0,0,0,.85); }
.q-text {
  font-family: var(--t-q); font-weight: var(--t-qw); line-height: 1.12; max-width: 30ch; text-wrap: balance; overflow-wrap: anywhere;
  font-size: 48px; white-space: pre-line;
}
.q-fit { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }

/* Multiple-choice options on the play screens */
.q-card-big.has-choices { flex-direction: column; align-items: stretch; gap: clamp(10px, 2vh, 22px); padding: clamp(14px, 2.6vw, 36px); }
.q-card-big.has-choices .q-fit { flex: 1; min-height: 0; }
.choices { display: grid; gap: clamp(8px, 1.4vh, 14px); width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices[data-n="3"], .choices[data-n="5"], .choices[data-n="6"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice {
  display: flex; align-items: center; gap: 12px; min-width: 0; text-align: left;
  padding: clamp(8px, 1.4vh, 14px) clamp(10px, 1.4vw, 16px); border-radius: 14px; border: 2px solid var(--t-line);
  background: rgba(255,255,255,.06); color: inherit;
  font-family: var(--t-q); font-weight: var(--t-qw); line-height: 1.15;
  font-size: calc(clamp(17px, min(2.5vw, 3.6vh), 34px) * var(--t-qscale));
  transition: opacity .3s ease, background-color .3s ease, box-shadow .3s ease, border-color .3s ease;
}
.th-light .choice { background: rgba(0,0,0,.04); }
.choices.long .choice { font-size: calc(clamp(15px, min(1.9vw, 2.8vh), 26px) * var(--t-qscale)); }
.choice .letter {
  flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center;
  background: var(--t-accent); color: #111; font-family: var(--f-display); font-weight: 800; font-size: .78em;
}
.th-light .choice .letter { color: #fff; }
.choice .ct { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.choice .tickmark { flex: none; width: 1.3em; height: 1.3em; display: grid; place-items: center; color: var(--mint); }
.choice .tickmark svg { width: 100%; height: 100%; }
.choices.compact { gap: 6px; }
.choices.compact .choice { font-size: calc(clamp(14px, min(1.8vw, 2.5vh), 22px) * var(--t-qscale)); padding: 6px 10px; border-radius: 10px; gap: 8px; }
.choice.correct { border-color: var(--mint); background: rgba(69,224,165,.2); box-shadow: 0 0 0 3px rgba(69,224,165,.25); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.choice.correct .letter { background: var(--mint); color: #062a1c; }
.th-light .choice.correct { background: rgba(11,122,80,.14); border-color: #0b7a50; }
.choice.dim { opacity: .38; }
.a-card.has-choices { gap: 8px; }
.a-card.has-choices .a-reveal { min-height: clamp(48px, 8vh, 80px); }
.a-card.has-choices .a-answer { font-size: calc(clamp(20px, min(3.6vw, 5vh), 44px) * var(--t-qscale)); }
.a-letter { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; border-radius: 50%; background: var(--mint); color: #062a1c; font-family: var(--f-display); font-size: .7em; margin-right: .35em; vertical-align: .12em; }

/* Answers */
.a-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 16px); }
.a-card { background: var(--t-card); color: var(--t-card-ink); border: 2px solid var(--t-line); border-radius: clamp(16px, 2.4vw, 26px); padding: clamp(12px, 2vw, 22px) clamp(16px, 3vw, 30px); display: flex; flex-direction: column; gap: 10px; }
.th-boxed .a-card { border-width: 4px; box-shadow: 8px 8px 0 rgba(0,0,0,.85); }
.a-card .a-q { font-family: var(--t-q); font-weight: var(--t-qw); font-size: calc(clamp(16px, min(2.3vw, 3.2vh), 28px) * var(--t-qscale)); line-height: 1.2; opacity: .9; overflow-wrap: anywhere; white-space: pre-line; }
.a-reveal { display: flex; align-items: center; gap: 16px; min-height: clamp(64px, 11vh, 110px); }
.a-reveal .lbl { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; opacity: .7; flex: none; }
.a-answer { font-family: var(--t-q); font-weight: 800; color: var(--t-accent); font-size: calc(clamp(22px, min(5vw, 6vh), 64px) * var(--t-qscale)); line-height: 1.05; overflow-wrap: anywhere; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.th-light .a-answer { color: var(--t-accent); }
.a-answer.none { font-family: var(--f-body); font-size: 20px; color: inherit; opacity: .7; }
@keyframes pop { from { transform: scale(.6) rotate(-3deg); opacity: 0; } }
.reveal-btn { flex: 1; min-height: clamp(60px, 10vh, 100px); border-radius: 18px; border: 3px dashed var(--t-line); background: transparent; color: var(--t-card-ink); font-weight: 800; font-size: clamp(20px, 2.6vw, 30px); display: flex; align-items: center; justify-content: center; gap: 12px; }
.reveal-btn:active { transform: scale(.99); }
.reveal-btn svg { width: 32px; height: 32px; flex: none; }
.menu-item svg, .tile .tile-icon svg { flex: none; }
.btn-resume { background: var(--t-accent); color: #111; border-color: transparent; min-height: 44px; }
.th-light .btn-resume { color: #fff; }
.who-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-weight: 800; flex-wrap: wrap; }
.who-label .q { font-size: clamp(18px, 2.2vw, 24px); }
.who-label .count { opacity: .85; font-variant-numeric: tabular-nums; }
.tiles-area { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; overscroll-behavior: contain; padding-top: 6px; }
.pick-grid { display: grid; gap: var(--tile-gap, 12px); justify-content: center; grid-template-columns: repeat(var(--cols, 4), var(--tile-w, 150px)); }
.pick {
  position: relative; border: 0; padding: 0; background: var(--t-card); color: var(--t-card-ink); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; outline: 3px solid transparent; outline-offset: 0; transition: transform .15s cubic-bezier(.2,1.4,.4,1), outline-color .15s, box-shadow .2s;
}
.pick .portrait { border-radius: 0; aspect-ratio: 3 / 4; }
.pick .pname { font-weight: 800; font-size: clamp(14px, 1.6vw, 18px); padding: 6px 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: var(--label-h, 34px); line-height: calc(var(--label-h, 34px) - 12px); }
.pick .tick { position: absolute; top: 6px; right: 6px; width: clamp(24px, 30%, 40px); height: clamp(24px, 30%, 40px); border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.7); transition: transform .2s cubic-bezier(.2,1.6,.4,1), background .15s; }
.pick .tick svg { width: 60%; height: 60%; color: #062a1c; opacity: 0; }
.pick .plus-pts { position: absolute; left: 6px; top: 6px; font-family: var(--f-display); font-weight: 800; font-size: clamp(13px, 1.4vw, 20px); background: var(--mint); color: #062a1c; padding: 2px 10px; border-radius: 999px; opacity: 0; transform: translateY(8px) scale(.6); transition: all .25s cubic-bezier(.2,1.6,.4,1); }
.pick[aria-pressed="true"] { outline-color: var(--mint); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(69,224,165,.35); }
.pick[aria-pressed="true"] .tick { background: var(--mint); border-color: var(--mint); transform: scale(1.1); }
.pick[aria-pressed="true"] .tick svg { opacity: 1; }
.pick[aria-pressed="true"] .plus-pts { opacity: 1; transform: none; }
.pick:not([aria-pressed="true"]) .portrait img { filter: saturate(.85); }

/* Interstitial (answers intro) */
.inter { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
.inter h1 { font-family: var(--t-title); color: var(--t-accent); font-size: calc(clamp(48px, 9vw, 120px) * var(--t-titlescale)); font-weight: 400; line-height: 1; }
.inter p { font-size: clamp(18px, 2.4vw, 26px); font-weight: 700; max-width: 30ch; background: var(--t-card); color: var(--t-card-ink); padding: 12px 22px; border-radius: 18px; }

/* Leaderboard */
.board { --t-ink: var(--text); --t-card: rgba(28,26,42,.85); --t-card-ink: var(--text); --t-line: var(--line); --t-accent: var(--gold); }
.board.stage { background: radial-gradient(90% 70% at 50% 0%, #3b2e66 0%, #1a1630 55%, #0f0d18 100%); }
.board.stage::before { background:
  conic-gradient(from 200deg at 15% -10%, transparent 0 40deg, rgba(255,203,71,.10) 50deg, transparent 60deg),
  conic-gradient(from 120deg at 85% -10%, transparent 0 40deg, rgba(255,93,125,.10) 50deg, transparent 60deg); }
.board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.board-head h1 { font-size: clamp(30px, min(5.6vw, 8vh), 64px); font-weight: 800; letter-spacing: -0.03em; }
.board-head h1 span { color: var(--gold); }
.board-head .after { color: var(--muted); font-weight: 700; font-size: 17px; }
.lb { position: relative; flex: 1; min-height: 0; }
.lb-row {
  position: absolute; left: 0; top: 0; width: var(--col-w, 100%); height: calc(var(--row-h, 64px) - 8px);
  display: grid; grid-template-columns: 64px var(--av-size, 52px) minmax(0, 1fr) minmax(80px, 2.2fr) 92px; align-items: center; gap: 14px;
  background: var(--panel); border-radius: 16px; padding: 0 16px 0 10px; outline: 1px solid var(--line); outline-offset: -1px;
  transition: transform 1s cubic-bezier(.6,0,.25,1), background-color .4s;
}
.lb-row .rank { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 4px; }
.lb-row .rank .mv { font-size: 13px; font-family: var(--f-body); font-weight: 800; }
.lb-row .rank .mv.up { color: var(--mint); } .lb-row .rank .mv.down { color: var(--pink); }
.lb-row .av { --av: var(--av-size, 52px); }
.lb-row .nm { min-width: 0; }
.lb-row .nm b { display: block; font-family: var(--f-display); font-size: clamp(18px, 2.2vw, 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.lb-row .nm small { color: var(--mint); font-weight: 800; font-size: 14px; opacity: 0; transition: opacity .4s .6s; }
.lb-row .nm small.zero { color: var(--muted); }
.lb.shown .lb-row .nm small { opacity: 1; }
.lb-row .bar { height: 14px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
.lb-row .bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--sky), var(--mint)); transition: width 1.1s cubic-bezier(.3,0,.2,1); }
.lb-row .score { font-family: var(--f-display); font-weight: 800; line-height: 1; font-size: clamp(26px, 3.2vw, 38px); text-align: right; font-variant-numeric: tabular-nums; }
.lb-row.r1 { background: linear-gradient(90deg, #4a3a12, #2a2238 70%); outline: 2px solid var(--gold); }
.lb-row.r1 .bar i { background: linear-gradient(90deg, #ffb02e, var(--gold)); }
.lb-row.r2 { outline-color: #cfd6e6; } .lb-row.r3 { outline-color: #d79a6a; }
.lb-row .crown { position: absolute; left: 70px; top: -14px; font-size: 26px; transform: rotate(-18deg); }
.lb.two-col .lb-row { grid-template-columns: 62px var(--av-size, 40px) minmax(0, 1fr) 64px; }
.lb-row.compact .rank { gap: 2px; }
.lb-row .rank .mv { font-size: 12px; }
.lb.two-col .lb-row .bar { display: none; }
.lb-row.compact { grid-template-columns: 62px var(--av-size, 40px) minmax(0, 1fr) minmax(40px, 1fr) 64px; gap: 10px; }
.lb-row.compact .nm b { font-size: clamp(16px, 1.8vw, 20px); }
.lb-row.compact .nm small { white-space: nowrap; font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }
.lb-row.compact .score { font-size: clamp(22px, 2.6vw, 30px); }
.lb-row.compact .rank { font-size: 22px; }
.lb-row.compact .crown { left: 50px; font-size: 20px; top: -10px; }

/* Final podium */
.podium-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: end; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 14px; height: 100%; min-height: 0; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.pod .portrait { width: min(100%, calc(18vh * var(--pk, 1))); border: 4px solid var(--line); box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.pod.rk1 .portrait { width: min(100%, calc(24vh * var(--pk, 1))); border-color: var(--gold); box-shadow: 0 0 0 6px rgba(255,203,71,.25), 0 24px 60px rgba(255,203,71,.3); }
.pod.rk2 .portrait { border-color: #cfd6e6; } .pod.rk3 .portrait { border-color: #d79a6a; }
.pod .nm { font-family: var(--f-display); font-weight: 800; font-size: clamp(18px, 2.4vw, 30px); text-align: center; overflow-wrap: anywhere; line-height: 1.1; }
.pod .block { width: 100%; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 12px; font-family: var(--f-display); font-weight: 800; }
.pod .block .place { font-size: clamp(28px, 4vw, 52px); line-height: 1; }
.pod .block .pts { font-size: 16px; opacity: .8; font-variant-numeric: tabular-nums; }
.pod.rk1 .block { height: max(16vh, 130px); background: linear-gradient(#ffd35e, #e9a91e); color: #3a2600; }
.pod.rk2 .block { height: max(11vh, 104px); background: linear-gradient(#e6eaf3, #aab3c7); color: #1f2433; }
.pod.rk3 .block { height: max(8vh, 90px); background: linear-gradient(#e6ad7f, #b8774a); color: #2d1606; }
.pod.empty { visibility: hidden; }
.rest { display: flex; flex-direction: column; gap: 8px; align-self: stretch; overflow: auto; min-height: 0; }
.rest > :first-child { margin-top: auto; }
.rest { gap: clamp(4px, 1vh, 8px); }
.rest-row { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px 6px 8px; flex: none; }
.rest-row .rank { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.rest-row b { font-family: var(--f-display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest-row .score { font-family: var(--f-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.winner-line { text-align: center; font-weight: 800; font-size: clamp(18px, 2.2vw, 24px); color: var(--gold); }

/* Stage chips and boxed (busy-background) themes */
.stage .chip.off { color: var(--t-card-ink); background: var(--t-card); }
.th-light .chip.d1 { color: #0b7a50; } .th-light .chip.d2 { color: #8a5d00; } .th-light .chip.d3 { color: #b3123a; }
.th-boxed .play-bar .crumb, .th-boxed .q-count, .th-boxed .who-label, .th-boxed .inter h1 {
  background: var(--t-card); color: var(--t-card-ink); border: 3px solid var(--t-line); border-radius: 14px; padding: 4px 14px;
}
.th-boxed .q-count { color: var(--t-accent); }
.th-boxed .inter h1 { color: var(--t-accent); padding: 6px 24px 12px; }

.th-rewind .intro .host strong, .th-rewind .q-count { font-family: var(--t-q); }
.save-chip { background: rgba(255,93,93,.18); color: #ffb0b0; border: 1px solid rgba(255,93,93,.5); }

/* Re-rendering an open sheet must not replay its entrance animation. */
.ov-layer.entered .scrim, .ov-layer.entered .sheet { animation: none; }

.th-pitlane .who-label .count { background: var(--t-card); padding: 2px 10px; border-radius: 999px; }

/* Menu */
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-item { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--raised); border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 17px; min-height: 56px; }
.menu-item svg { width: 22px; height: 22px; flex: none; color: var(--gold); }
.menu-item small { display: block; color: var(--muted); font-weight: 600; font-size: 14px; }
.menu-item.danger svg { color: var(--danger); }
.jump-list { display: flex; flex-direction: column; gap: 8px; }
.jump-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--raised); border-radius: 14px; padding: 8px 10px; }
.jump-row .n { font-family: var(--f-display); font-weight: 800; color: var(--muted); text-align: center; }
.jump-row .t { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.jump-row .t small { display: block; color: var(--muted); font-weight: 600; }
.jump-row .b { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.jump-row .btn { background: var(--panel); border-color: var(--line); }
.jump-row { grid-template-columns: 34px minmax(0, 1fr); }
.jump-row .b { grid-column: 2; justify-content: flex-start; }
.jump-row.current { outline: 2px solid var(--gold); }
.adjust-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; background: var(--raised); border-radius: 14px; padding: 8px 12px; }
.adjust-row .val { font-family: var(--f-display); font-weight: 800; font-size: 22px; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
.adjust-row .nm { font-weight: 700; overflow-wrap: anywhere; }
.adjust-row .nm small { display: block; color: var(--muted); font-weight: 600; }

/* History / results */
.game-list { display: flex; flex-direction: column; gap: 12px; }
.game-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--panel); border-radius: var(--r-md); padding: 14px 16px; outline: 1px solid var(--line); outline-offset: -1px; }
.game-row h3 { font-size: 21px; overflow-wrap: anywhere; }
.game-row .meta { color: var(--muted); font-weight: 600; font-size: 15px; }
.game-row .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.table-wrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--line); }
table.scores { border-collapse: collapse; width: 100%; min-width: 560px; font-variant-numeric: tabular-nums; }
table.scores th, table.scores td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.scores th { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--panel); }
table.scores th.cat { text-transform: none; letter-spacing: 0; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
table.scores td.p { text-align: left; font-weight: 700; }
table.scores .pc { display: flex; align-items: center; gap: 10px; }
table.scores th.pcol { text-align: left; }
table.scores th.pcol, table.scores td.p { position: sticky; left: 0; z-index: 1; background: var(--stage); box-shadow: 8px 0 12px -8px rgba(0,0,0,.6); }
table.scores th.pcol { background: var(--panel); }
table.scores td.p .av { --av: 34px; }
table.scores td.tot { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--gold); }
table.scores td.host { color: var(--muted); font-size: 13px; }

.settings-list { display: flex; flex-direction: column; gap: 14px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; }
.setting .txt { min-width: 0; flex: 1 1 260px; }
.setting .txt b { display: block; font-size: 18px; }
.setting .txt span { color: var(--muted); font-size: 15px; }

/* Confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }

/* ---------- Theme backdrops ---------- */
.th-premiere { background: radial-gradient(120% 80% at 50% 0%, #74132a 0%, #3c0915 45%, #19040a 100%); }
.th-premiere::before { background:
  radial-gradient(circle, #ffe08a 0 3.5px, rgba(255,224,138,.35) 5px, transparent 7px) 0 6px / 34px 22px repeat-x,
  repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 22px, rgba(255,255,255,.03) 22px 44px); }
.th-premiere::after { background: radial-gradient(70% 60% at 50% 40%, rgba(255,200,120,.16), transparent 70%); }

.th-vinyl { background: #120c22; }
.th-vinyl::before { background: repeating-radial-gradient(circle at 92% 108%, rgba(255,255,255,.055) 0 1.5px, transparent 1.5px 8px); }
.th-vinyl::after { background: radial-gradient(40% 50% at 92% 108%, rgba(255,61,139,.45), transparent 70%), radial-gradient(40% 40% at 0% 0%, rgba(49,231,255,.22), transparent 70%); }

.th-stadium { background: repeating-linear-gradient(90deg, #13703f 0 9%, #0f5f36 9% 18%); }
.th-stadium::before { background:
  radial-gradient(circle at 50% 50%, transparent 0 18vh, rgba(255,255,255,.22) calc(18vh + 1px) calc(18vh + 4px), transparent calc(18vh + 5px)),
  linear-gradient(90deg, transparent calc(50% - 2px), rgba(255,255,255,.22) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)); }
.th-stadium::after { background: radial-gradient(80% 70% at 50% 50%, transparent 40%, rgba(0,0,0,.35)); }

.th-lab { background: #0a1a2f; }
.th-lab::before { background:
  linear-gradient(rgba(62,242,208,.09) 1px, transparent 1px) 0 0 / 34px 34px,
  linear-gradient(90deg, rgba(62,242,208,.09) 1px, transparent 1px) 0 0 / 34px 34px; }
.th-lab::after { background: radial-gradient(50% 50% at 80% 20%, rgba(62,242,208,.18), transparent 70%), radial-gradient(40% 40% at 10% 90%, rgba(255,159,67,.14), transparent 70%); }

.th-archive { background: #ead9b2; }
.th-archive::before { background:
  radial-gradient(60% 40% at 20% 10%, rgba(180,140,80,.25), transparent 70%),
  radial-gradient(50% 50% at 90% 90%, rgba(150,100,50,.25), transparent 70%),
  radial-gradient(circle at 50% 50%, transparent 60%, rgba(110,70,30,.3)); }
.th-archive::after { inset: 14px; border: 2px solid rgba(110,80,40,.45); outline: 1px solid rgba(110,80,40,.35); outline-offset: 5px; border-radius: 6px; }

.th-passport { background: #0f4d5c; }
.th-passport::before { background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 56px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 56px); }
.th-passport::after { background:
  radial-gradient(circle at 88% 16%, transparent 0 54px, rgba(255,106,77,.5) 55px 58px, transparent 59px 64px, rgba(255,106,77,.35) 65px 67px, transparent 68px),
  radial-gradient(70% 70% at 0% 100%, rgba(255,209,102,.16), transparent 70%); }

.th-diner { background: conic-gradient(#e63946 25%, #fff3e0 0 50%, #e63946 0 75%, #fff3e0 0) 0 0 / 72px 72px; }
.th-diner::after { background: radial-gradient(90% 80% at 50% 50%, transparent 50%, rgba(60,0,0,.28)); }

.th-wild { background: linear-gradient(160deg, #1f4a2e, #0b1f13); }
.th-wild::before { background:
  radial-gradient(ellipse 60px 26px at 8% 18%, rgba(199,227,107,.16) 98%, transparent),
  radial-gradient(ellipse 90px 34px at 92% 12%, rgba(199,227,107,.12) 98%, transparent),
  radial-gradient(ellipse 120px 44px at 85% 86%, rgba(199,227,107,.12) 98%, transparent),
  radial-gradient(ellipse 70px 28px at 12% 80%, rgba(255,159,90,.12) 98%, transparent); }
.th-wild::after { background: radial-gradient(60% 60% at 50% 40%, rgba(199,227,107,.1), transparent 70%); }

.th-arcade { background: #0d0221; }
.th-arcade::before { background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px),
  linear-gradient(transparent 62%, rgba(255,0,230,.18) 62.2%, transparent 62.6%) ; }
.th-arcade::after { background:
  linear-gradient(90deg, rgba(0,255,159,.13) 1px, transparent 1px) 0 0 / 60px 100%,
  radial-gradient(60% 40% at 50% 100%, rgba(255,0,230,.3), transparent 70%); -webkit-mask: linear-gradient(transparent 60%, #000); mask: linear-gradient(transparent 60%, #000); }

.th-tabloid { background: #ffe600; }
.th-tabloid::before { background: radial-gradient(rgba(0,0,0,.14) 1.6px, transparent 2.2px) 0 0 / 14px 14px; }
.th-tabloid::after { background: linear-gradient(115deg, transparent 0 70%, rgba(255,45,85,.9) 70% 76%, transparent 76%); }

.th-gallery { background: #f6f3ec; }
.th-gallery::before { background:
  linear-gradient(#141414, #141414) 0 0 / 100% 0,
  linear-gradient(90deg, transparent 0 12px, #141414 12px 20px, transparent 20px) 0 0 / 160px 160px no-repeat,
  linear-gradient(#d7263d, #d7263d) 0 0 / 12px 160px no-repeat,
  linear-gradient(#141414, #141414) 0 160px / 220px 8px no-repeat,
  linear-gradient(#1b4d9c, #1b4d9c) 100% 100% / 180px 120px no-repeat,
  linear-gradient(#141414, #141414) calc(100% - 180px) 100% / 8px 200px no-repeat,
  linear-gradient(#f4c20d, #f4c20d) calc(100% - 188px) 100% / 90px 80px no-repeat,
  linear-gradient(#141414, #141414) 100% calc(100% - 120px) / 278px 8px no-repeat; }

.th-orbit { background: radial-gradient(120% 90% at 70% 10%, #1b1450 0%, #090a1d 50%, #04050c 100%); }
.th-orbit::before { background:
  radial-gradient(1.2px 1.2px at 20px 30px, #fff 99%, transparent) 0 0 / 120px 110px,
  radial-gradient(1px 1px at 70px 80px, rgba(255,255,255,.8) 99%, transparent) 0 0 / 150px 130px,
  radial-gradient(1.6px 1.6px at 40px 100px, rgba(255,240,200,.9) 99%, transparent) 0 0 / 210px 190px; }
.th-orbit::after { background: radial-gradient(circle at 88% 82%, #ffb86b 0 46px, rgba(255,184,107,.25) 47px 70px, transparent 71px), radial-gradient(50% 40% at 20% 20%, rgba(140,123,255,.25), transparent 70%); }

.th-tide { background: linear-gradient(180deg, #0b6f94 0%, #076894 45%, #05405e 100%); }
.th-tide .q-count small, .th-tide .play-bar .crumb { opacity: 1; }
.th-tide .q-count, .th-tide .play-bar .crumb, .th-tide .who-label, .th-tide .intro .emoji { text-shadow: 0 2px 10px rgba(3,48,72,.85); }
.th-tide::before { background:
  radial-gradient(circle at 50% 0, transparent 30px, rgba(255,255,255,.16) 31px 34px, transparent 35px) 0 calc(100% - 20px) / 90px 40px repeat-x,
  radial-gradient(circle at 50% 0, transparent 30px, rgba(255,255,255,.1) 31px 34px, transparent 35px) 45px calc(100% - 60px) / 90px 40px repeat-x; }
.th-tide::after { background: radial-gradient(circle at 88% 4%, rgba(255,210,122,.9) 0 40px, rgba(255,210,122,.2) 41px 80px, transparent 81px); }

.th-tome { background: radial-gradient(110% 90% at 50% 0%, #3a1d66 0%, #1b0f30 70%); }
.th-tome::before { inset: 14px; border: 2px solid rgba(232,195,106,.5); outline: 1px solid rgba(232,195,106,.3); outline-offset: 6px; border-radius: 10px; }
.th-tome::after { background: radial-gradient(40% 30% at 50% 30%, rgba(232,195,106,.14), transparent 70%), radial-gradient(1.4px 1.4px at 30px 40px, rgba(232,195,106,.6) 99%, transparent) 0 0 / 140px 120px; }

.th-rewind { background: linear-gradient(180deg, #1a0633 0%, #3c0a58 50%, #a31a6b 72%, #ff2a6d 100%); }
.th-rewind::before { background:
  linear-gradient(rgba(5,217,232,.4) 2px, transparent 2px) 0 0 / 100% 36px,
  linear-gradient(90deg, rgba(5,217,232,.4) 2px, transparent 2px) 0 0 / 60px 100%;
  -webkit-mask: linear-gradient(transparent 68%, #000 100%); mask: linear-gradient(transparent 68%, #000 100%); }
.th-rewind::after { background: radial-gradient(circle at 50% 74%, #ffcf5a 0 70px, rgba(255,42,109,.0) 71px), repeating-linear-gradient(0deg, transparent 0 8px, rgba(26,6,51,.9) 8px 11px);
  -webkit-mask: radial-gradient(circle at 50% 74%, #000 0 70px, transparent 71px); mask: radial-gradient(circle at 50% 74%, #000 0 70px, transparent 71px); opacity: .9; }

.th-pitlane { background: #151515; }
.th-pitlane::before { background:
  conic-gradient(#f5f5f5 25%, #151515 0 50%, #f5f5f5 0 75%, #151515 0) 0 0 / 28px 28px; -webkit-mask: linear-gradient(#000 0 28px, transparent 28px calc(100% - 28px), #000 calc(100% - 28px)); mask: linear-gradient(#000 0 28px, transparent 28px calc(100% - 28px), #000 calc(100% - 28px)); opacity: .9; }
.th-pitlane::after { background: linear-gradient(100deg, transparent 0 86%, rgba(255,59,48,.85) 86% 89%, transparent 89% 90.5%, rgba(255,214,10,.8) 90.5% 92%, transparent 92%); opacity: .55; }

.th-runway { background: linear-gradient(180deg, #120e10, #2a2024); }
.th-runway::before { background: conic-gradient(from 160deg at 50% -20%, transparent 0 10deg, rgba(255,240,235,.13) 18deg, transparent 26deg), radial-gradient(80% 20% at 50% 100%, rgba(244,182,194,.25), transparent 70%); }
.th-runway::after { background: linear-gradient(90deg, transparent calc(50% - 90px), rgba(255,255,255,.05) calc(50% - 90px) calc(50% + 90px), transparent calc(50% + 90px)); }

.th-party { background: linear-gradient(160deg, #3a2390, #1e1454); }
.th-party::before { background:
  radial-gradient(circle at 20px 20px, #ffd23f 0 5px, transparent 6px) 0 0 / 150px 140px,
  radial-gradient(circle at 90px 60px, #ff5d8f 0 4px, transparent 5px) 0 0 / 170px 130px,

const THEME_BY_ID = Object.fromEntries(THEMES.map((t) => [t.id, t]));
const DEFAULT_THEME = 'party';

function themeOf(id) {
  return THEME_BY_ID[id] || THEME_BY_ID[DEFAULT_THEME];
}

// Pick the theme whose keywords best match a category name. Longer keyword hits win
// so "video games" beats "games" and "pop culture" beats "pop".
function suggestTheme(category) {
  const plain = String(category || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const text = ' ' + plain.replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  if (!text.trim()) return DEFAULT_THEME;
  let best = null;
  let bestLen = 0;
  for (const t of THEMES) {
    for (const k of t.kw) {
      const needle = ' ' + k.replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
      if (text.includes(needle) && needle.length > bestLen) {
        best = t.id;
        bestLen = needle.length;
      }
    }
  }
  return best || DEFAULT_THEME;
}

// CSS custom properties a themed screen reads.
function themeVars(t) {
  // Font stacks are quoted with " in THEMES; inline style attributes are double-quoted, so swap to '.
  const f = (v) => String(v).replace(/"/g, "'");
  return [
    `--t-ink:${t.ink}`, `--t-accent:${t.accent}`, `--t-accent2:${t.accent2}`,
    `--t-card:${t.card}`, `--t-card-ink:${t.cardInk}`, `--t-line:${t.line}`,
    `--t-title:${f(t.title)}`, `--t-q:${f(t.q)}`, `--t-qw:${t.qWeight || 600}`,
    `--t-qscale:${t.qScale || 1}`, `--t-titlescale:${t.titleScale || 1}`,
  ].join(';');
}

// Halloween artwork for Trivia Day: every function returns an inline SVG markup string.
// No DOM access, no globals besides HART. Colours are CSS custom properties with fallbacks,
// so the app can recolour; ids (clip paths) get a per-call suffix so nothing is shared between SVGs.
const HART = (() => {
  let uid = 0;
  const nid = (p) => `hart-${p}-${(++uid).toString(36)}`;
  const v = (n, fb) => `var(--${n}, ${fb})`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const svg = (name, vb, body, extra = '') =>
    `<svg class="hart hart-${name}${extra}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${body}</svg>`;
  const f1 = (n) => +n.toFixed(1);
  // ellipse as a path fragment (so several shapes can share one fill/stroke)
  const ell = (cx, cy, rx, ry) => `M${f1(cx - rx)} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0Z`;
  // a closed "cloud" of outward bumps around an ellipse (fluffy fur)
  const fluff = (cx, cy, rx, ry, n, k = 0.62, a0 = 0) => {
    const P = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + (i / n) * Math.PI * 2;
      P.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    let d = `M${f1(P[0][0])} ${f1(P[0][1])}`;
    for (let i = 1; i <= n; i++) {
      const r = f1(Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) * k);
      d += `A${r} ${r} 0 0 1 ${f1(P[i][0])} ${f1(P[i][1])}`;

  const C = {
    night: v('night', '#0d0a17'), line: v('line', '#3d2f5c'), text: v('text', '#f8f1e7'),
    pumpkin: v('pumpkin', '#ff8a1f'), deep: v('pumpkin-deep', '#d9590b'), glow: v('glow', '#ffd54a'),

  const WEB = (() => {

// Re-render for changes that arrived from elsewhere (another tab, the cloud) without yanking focus mid-typing.

let chan = null;
try { chan = new BroadcastChannel('trivia-day'); } catch { chan = null; }

// IndexedDB writes are async and can be cut off by a reload; this synchronous copy covers that gap.
function mirrorNow() { if (!Saver.blocked) lsSet('td:mirror', S); }
const Saver = {

  async flush() {

      // Another tab may have saved since we last looked: fold its changes in rather than overwrite them.
      let stored = null;
      try { stored = await Local.get('state'); } catch { stored = null; }
      if (stored && stored.v && stored.writer !== TAB_ID) {
        if (mergeInto(S, migrate(stored))) softRender();
      }
      const snap = Object.assign(clone(S), { writer: TAB_ID });
      const where = await Local.set('state', snap);
      const ok = !!where;
      if (ok) {
        this.lastSeen = Math.max(this.lastSeen, snap.updatedAt || 0);
        if (where === 'idb') { lsDel('td:mirror'); lsDel('td:state'); }
        if (chan) { try { chan.postMessage({ type: 'saved', tab: TAB_ID }); } catch { /* ignore */ } }

      if (bad && !this.failed) { this.failed = true; toast(ok ? 'Saving to a backup spot on this device. Reload when you can.' : 'This browser is not saving. Keep this tab open.', 'bad'); updateSyncNote(); }

// ===================== Photos =====================
const Photos = {
  map: {}, // playerId -> {data, at}
  async loadAll() {
    const keys = await Local.keys('photo:');
    await Promise.all(keys.map(async (k) => {
      const id = k.slice(6);
      if (!okId(id)) return;
      const v = await Local.get(k);
      if (v && typeof v.data === 'string' && v.data.startsWith('data:image/')) this.map[id] = v;
    }));
    if (Local.mode !== 'idb') return;
    const stray = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('td:photo:')) stray.push(k); } } catch { /* ignore */ }
    for (const k of stray) {
      const id = k.slice(9); const v = lsGet(k);
      if (!okId(id) || !v || typeof v.data !== 'string' || !v.data.startsWith('data:image/')) { lsDel(k); continue; }
      const cur = this.map[id];
      if (!cur || (v.at || 0) > (cur.at || 0)) { if ((await Local.set('photo:' + id, v)) === 'idb') { this.map[id] = v; lsDel(k); } }
      else lsDel(k);
    }
  },
  async reload(id) {
    let v = null;
    try { v = await Local.get('photo:' + id); } catch { v = null; }
    if (v && v.data) this.map[id] = v; else delete this.map[id];
  },
  src(p) {
    if (!p) return null;
    if (p.demo) return demoAvatar(p);
    if (p.hasPhoto === false) return null;
    const e = this.map[p.id];
    if (e && (!p.photoAt || e.at >= p.photoAt)) return e.data;
    if (p.photoAsset) return '/_blob/' + p.photoAsset;
    return e ? e.data : null;
  },
  async set(id, data, at) {
    this.map[id] = { data, at };
    const ok = await Local.set('photo:' + id, { data, at });
    if (!ok) toast("This photo couldn't be saved on this device (storage may be full). It stays until you reload.", 'bad');
    if (chan) { try { chan.postMessage({ type: 'photo', tab: TAB_ID, id }); } catch { /* ignore */ } }
  },
  async remove(id) {
    delete this.map[id];
    await Local.del('photo:' + id);
    if (chan) { try { chan.postMessage({ type: 'photo', tab: TAB_ID, id }); } catch { /* ignore */ } }
  },
  async clearAll() { for (const id of Object.keys(this.map)) await this.remove(id); },
};
const hasPhoto = (p) => !!Photos.src(p);
const inAnyGame = (pid) => Object.values(S.games).some((g) => g.playerIds.includes(pid));

const demoCache = {};
function demoAvatar(p) {
  if (demoCache[p.id]) return demoCache[p.id];
  const h = hashStr(p.id) % 360;
  const skins = ['#f1c7a5', '#d9a27c', '#a8714f', '#7a4a2e', '#f6d5bf'];
  const skin = skins[hashStr(p.id + 's') % skins.length];
  const outfit = `hsl(${(h + 150) % 360} 72% 56%)`;
  const bg = `hsl(${h} 55% 28%)`;
  const hair = `hsl(${(h + 30) % 360} 35% 18%)`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="${bg}"/><circle cx="250" cy="60" r="90" fill="rgba(255,255,255,.08)"/><path d="M36 400 C48 292 92 252 150 252 C208 252 252 292 264 400Z" fill="${outfit}"/><path d="M118 252 L150 306 L182 252Z" fill="rgba(255,255,255,.4)"/><rect x="132" y="208" width="36" height="52" rx="14" fill="${skin}"/><circle cx="150" cy="164" r="62" fill="${skin}"/><path d="M86 160 C86 108 120 94 150 94 C186 94 216 112 214 160 C200 128 172 122 150 122 C124 122 100 132 86 160Z" fill="${hair}"/><circle cx="128" cy="170" r="6" fill="#222"/><circle cx="172" cy="170" r="6" fill="#222"/><path d="M130 196 Q150 212 170 196" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  demoCache[p.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return demoCache[p.id];
}

// Initials always sit underneath; if a photo fails to load it removes itself and they show through.
function avatar(p, cls = '') {
  const src = Photos.src(p);
  const bg = colorFor(p ? p.id : 'x');
  return `<span class="av ${cls}" style="background:${bg}"><span class="ini">${esc(initials(p && p.name) || '?')}</span>${src ? `<img src="${esc(src)}" alt="" draggable="false" onerror="this.remove()">` : ''}</span>`;
}
function portrait(p, cls = '') {
  const src = Photos.src(p);
  const bg = colorFor(p ? p.id : 'x');
  return `<span class="portrait ${cls}" style="background:${bg}"><span class="ini">${esc(initials(p && p.name) || '?')}</span>${src ? `<img src="${esc(src)}" alt="" draggable="false" onerror="this.remove()">` : ''}</span>`;
}

// ===================== Cloud backup (claude.ai artifact db + assets, or this site's own /api) =====================
// One document per player (players/<id>) and per game (games/<id>, a tombstone when deleted), plus
// trivia/meta for the event name and settings. A device only writes records it changed more recently
// than the copy it last saw in the cloud, so a stale device can't overwrite anyone else's work.
const CLOUD_BACKOFF = [10000, 30000, 120000, 300000];
// The home-screen app saves to the cloud at most this often (every tap is already saved on the device),
// which keeps a whole event inside the free plan's monthly allowance.
const HTTP_GAP = Number(lsGet('td:httpgap')) || 25000;

// The home-screen version's own cloud: /api on the site it's served from, unlocked with the event code.
// Same shape as the claude.ai db/assets capabilities, so Cloud below works with either.
const HttpCloud = {
  key: '', cache: null, cacheAt: 0, inflight: null, usage: null,
  headers(extra = {}) { return { 'x-trivia-key': this.key, ...extra }; },
  async call(path, opts = {}, ms = 15000) {
    const ac = typeof AbortController === 'function' ? new AbortController() : null;

  async probe() {
    const ac = typeof AbortController === 'function' ? new AbortController() : null;
    const t = setTimeout(() => ac && ac.abort(), 6000);
    try {
      const r = await fetch('/api/ping', { cache: 'no-store', ...(ac ? { signal: ac.signal } : {}) });
      const j = r.ok ? await r.json() : null;
      return !!(j && j.ok && j.app === 'trivia-day' && j.cloud);
    } catch { return false; } finally { clearTimeout(t); }
  },
  async login(key) {
    const ac = typeof AbortController === 'function' ? new AbortController() : null;
    const t = setTimeout(() => ac && ac.abort(), 15000);
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key }), cache: 'no-store', ...(ac ? { signal: ac.signal } : {}) }).catch(() => null);

    if (!this.inflight) {
      this.inflight = this.call('/api/db').then((r) => r.json()).then((j) => {
        this.cache = isObj(j.docs) ? j.docs : {}; this.cacheAt = Date.now(); this.usage = j.usage || null;
        return this.cache;
      }).finally(() => { this.inflight = null; });

HttpCloud.db = {
  doc(path) {
    return {
      async get() { const all = await HttpCloud.docs(); const d = all[path]; return { id: path.split('/').pop(), exists: !!d, data: () => (d ? clone(d) : undefined) }; },
      set: (data) => HttpCloud.db.setMany([{ path, data }]),
    };
  },
  collection(name) {
    return {
      async get() {
        const all = await HttpCloud.docs();
        const ids = Object.keys(all).filter((k) => k.startsWith(name + '/') && k.split('/').length === 2);
        return { docs: ids.map((k) => ({ id: k.slice(name.length + 1), data: () => clone(all[k]) })) };
      },
    };
  },
  // Each document says which cloud copy it was merged against (base); the server refuses the whole
  // batch with 'conflict' if any of them changed since, and Cloud.flush re-reads and tries again.
  async setMany(list) {
    let r;
    try { r = await HttpCloud.call('/api/db', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ set: list }) }); }
    catch (e) { if (e && e.code === 'conflict') HttpCloud.cache = null; throw e; }
    try { const j = await r.json(); if (j && j.limit) HttpCloud.usage = { ...(HttpCloud.usage || {}), writes: j.writes, limit: j.limit }; } catch { /* fine */ }

  },

HttpCloud.assets = {
  async upload(blob, opts = {}) {
    const r = await HttpCloud.call('/api/asset', { method: 'POST', headers: { 'content-type': opts.type || blob.type || 'image/jpeg' }, body: blob }, 45000);
    return r.json();
  },
  async delete(id) { await HttpCloud.call('/api/asset?id=' + encodeURIComponent(id), { method: 'DELETE' }); },
};

const Cloud = {
  status: 'off', db: null, assets: null, downloads: null, pulled: false, http: false, lastPush: 0,

  quotaWarned: false, photoWarned: false, uploading: new Set(),
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return this.initHttp();
    this.status = 'connecting'; updateSyncNote();
    const safeUse = (n) => Promise.resolve().then(() => c.use(n)).catch(() => null);
    const [db, assets, downloads] = await Promise.all([safeUse('db'), safeUse('assets'), safeUse('downloads')]);
    this.downloads = downloads;
    this.assets = assets;
    if (!db) { this.status = 'off'; updateSyncNote(); return; }
    this.db = db;
    await this.tryPull();
  },
  // Home-screen app: use this site's cloud if it has one. A device that already has the event code
  // keeps trying even when it starts offline.
  async initHttp() {
    if (!/^https?:$/.test(location.protocol) || this.http || this.probing) return;
    HttpCloud.key = lsGet('td:cloudkey') || '';
    this.probing = true;
    const has = await HttpCloud.probe().finally(() => { this.probing = false; });

    }

    if (!HttpCloud.key) { this.status = 'needkey'; updateSyncNote(); softRender(); return; }
    this.db = HttpCloud.db; this.assets = HttpCloud.assets;
    this.status = 'connecting'; updateSyncNote();
    await this.tryPull();
  },
  async connect(key) {
    key = String(key || '').trim();
    if (!key) throw { code: 'revoked', message: 'Enter the event code' };
    await HttpCloud.login(key);
    HttpCloud.key = key; lsSet('td:cloudkey', key);
    this.http = true; this.db = HttpCloud.db; this.assets = HttpCloud.assets;
    this.pulled = false; this.fails = 0; this.remoteAt.clear(); HttpCloud.cache = null;
    this.status = 'connecting'; updateSyncNote();
    await this.tryPull();
  },
  disconnect() {

    lsDel('td:cloudkey'); HttpCloud.key = ''; HttpCloud.cache = null;
    this.gen++; clearTimeout(this.timer); this.timer = null;
    this.db = null; this.assets = null; this.pulled = false; this.remoteAt.clear();
    this.status = 'needkey'; updateSyncNote();

  async tryPull() {

      if (gen !== this.gen) return;

      this.schedule(200);
      this.cacheRemotePhotos().then(() => this.uploadPendingPhotos());
    } catch (e) {
      if (gen !== this.gen) return;
      // Never push until we've seen the cloud copy, or an older device could overwrite newer data.
      console.warn('cloud pull failed', e);

  // Quietly pick up changes made on other devices (when the app comes back to the foreground).
  refresh() {

    this.refreshing = true;
    Promise.race([this.pull(), sleep(15000)]).catch(() => {}).finally(() => { this.refreshing = false; this.cacheRemotePhotos(); });
  },
  async pull() {
    this.lastPull = Date.now();
    const [meta, players, games] = await Promise.all([
      this.db.doc('trivia/meta').get(), this.db.collection('players').get(), this.db.collection('games').get(),

    const remote = { title: S.title, settings: S.settings, metaAt: 0, players: {}, games: {}, deletedGames: {} };

      const m = meta.data() || {};

    // after the removal, which would otherwise leave it in the cloud for good).
    const guideNow = new Set(guide().photos.map((ph) => ph.id));
    for (const ph of guideBefore) if (ph.asset && !guideNow.has(ph.id)) this.dropAsset(ph.asset);
    // Photos removed on another device go here too.
    for (const p of Object.values(S.players)) {
      const e = Photos.map[p.id];
      if (p.hasPhoto === false && e && e.at <= (p.photoAt || 0)) await Photos.remove(p.id);
    }
    const keepMk = new Set(guide().photos.map((ph) => ph.id));

    for (const p of Object.values(S.players)) if ((p.updatedAt || 0) > known('players/' + p.id)) out.push({ path: 'players/' + p.id, at: p.updatedAt || 0, data: p });
    for (const g of Object.values(S.games)) if ((g.updatedAt || 0) > known('games/' + g.id)) out.push({ path: 'games/' + g.id, at: g.updatedAt || 0, data: g });

    const snap = await this.db.doc(d.path).get();

    const m = snap.data() || {};

    if (remAt <= (this.remoteAt.has(d.path) ? this.remoteAt.get(d.path) : -1)) return;
    this.remoteAt.set(d.path, remAt);

    Saver.pending = true; Saver.flush();
  },
  async write(path, data) {
